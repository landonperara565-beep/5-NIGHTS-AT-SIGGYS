<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Sigrist</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: #fff;
        }

        /* CONTAINER USING YOUR GITHUB IMAGE */
        .viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* Points directly to siggy.png in your repository root */
            background: #080808 url('siggy.png') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
        }

        /* --- CRT VHS & GLITCH OVERLAYS --- */
        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.4) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .glitch-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.02);
            pointer-events: none;
            z-index: 11;
            animation: vhs-flicker 0.15s infinite;
        }

        @keyframes vhs-flicker {
            0% { opacity: 0.96; }
            50% { opacity: 1; }
            100% { opacity: 0.93; }
        }

        #static-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.12;
            pointer-events: none;
            z-index: 9;
        }

        /* --- TITLE --- */
        .title-container {
            z-index: 15;
            position: relative;
            max-width: 450px;
            animation: textGlitch 4s infinite;
        }

        .title-main {
            font-size: 3.8rem;
            font-weight: bold;
            color: #d32f2f;
            text-shadow: 3px 3px 0px #000, -2px -2px 0px #880000;
            line-height: 1.1;
            letter-spacing: 2px;
        }

        .title-sub {
            font-size: 2.8rem;
            color: #eeeeee;
            text-shadow: 2px 2px 0px #000;
            display: block;
            margin-bottom: 5px;
        }

        /* --- MENU BUTTONS --- */
        .menu-container {
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 20px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #aaaaaa;
            font-family: inherit;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            outline: none;
            transition: color 0.1s ease, transform 0.1s ease;
            position: relative;
            display: flex;
            align-items: center;
            width: fit-content;
        }

        .menu-btn .selector {
            opacity: 0;
            margin-right: 12px;
            color: #ffffff;
            font-size: 1.8rem;
            transition: opacity 0.1s ease;
        }

        .menu-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 2px 2px 0px #d32f2f;
            transform: translateX(6px);
        }

        .menu-btn:hover .selector {
            opacity: 1;
            animation: blinkSelector 0.6s infinite alternate;
        }

        @keyframes blinkSelector {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .top-right-info {
            position: absolute;
            top: 40px;
            right: 60px;
            text-align: right;
            z-index: 15;
            font-size: 1.6rem;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
        }

        .top-right-info .sub-info {
            font-size: 1.1rem;
            color: #cccccc;
        }

        .copyright {
            z-index: 15;
            font-size: 0.85rem;
            color: #888888;
            margin-top: auto;
        }

        @keyframes textGlitch {
            0%, 92%, 100% { transform: translate(0, 0); }
            93% { transform: translate(-2px, 1px) skewX(5deg); }
            94% { transform: translate(2px, -1px) skewX(-5deg); }
            95% { transform: translate(-1px, -1px); }
        }
    </style>
</head>
<body>

    <div class="viewport">
        <!-- CRT Scanlines & Glitch Canvas -->
        <div class="scanlines"></div>
        <div class="glitch-overlay"></div>
        <canvas id="static-canvas"></canvas>

        <!-- Top Right Clock -->
        <div class="top-right-info">
            <div>12 AM</div>
            <div class="sub-info">Night 1</div>
        </div>

        <!-- Left Menu Content -->
        <div class="content-left">
            <div class="title-container">
                <span class="title-sub">Five Nights</span>
                <span class="title-sub" style="font-size:1.8rem;">at</span>
                <span class="title-main">Sigrist</span>
            </div>

            <!-- Interactive Animated Buttons -->
            <div class="menu-container">
                <button class="menu-btn" onclick="startGame()">
                    <span class="selector">&gt;</span>New Game
                </button>
                <button class="menu-btn" onclick="continueGame()">
                    <span class="selector">&gt;</span>Continue
                </button>
                <button class="menu-btn" onclick="customNight()">
                    <span class="selector">&gt;</span>Custom Night
                </button>
                <button class="menu-btn" onclick="openSettings()">
                    <span class="selector">&gt;</span>Settings
                </button>
                <button class="menu-btn" onclick="openExtras()">
                    <span class="selector">&gt;</span>Extras
                </button>
            </div>
        </div>

        <!-- Bottom Copyright -->
        <div class="copyright">
            © 2026 Sigrist Entertainment<br>All rights reserved. (probably)
        </div>
    </div>

    <!-- VHS Static Noise Script -->
    <script>
        const canvas = document.getElementById('static-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth / 2;
            canvas.height = window.innerHeight / 2;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawStatic() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const buffer = new Uint32Array(imageData.data.buffer);
            for (let i = 0; i < buffer.length; i++) {
                if (Math.random() < 0.1) {
                    buffer[i] = 0xffffffff;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            requestAnimationFrame(drawStatic);
        }
        drawStatic();

        // Button Click Handler Functions
        function startGame() { alert("Starting New Game..."); }
        function continueGame() { alert("Loading Game..."); }
        function customNight() { alert("Opening Custom Night..."); }
        function openSettings() { alert("Opening Settings..."); }
        function openExtras() { alert("Opening Extras..."); }
    </script>
</body>
</html>
